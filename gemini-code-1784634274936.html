<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>操盤手 終極複利與停損追蹤器 (手機完美版)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header h1 {
            margin: 0;
            color: var(--accent-gold);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid var(--accent-gold);
            text-align: center;
        }

        .stat-card h3 {
            margin: 0 0 5px 0;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .stat-card .value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .table-container {
            background-color: var(--card-bg);
            border-radius: 15px;
            overflow-y: auto;
            overflow-x: auto;
            max-height: 70vh;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 800px;
        }

        thead {
            background-color: #0f172a;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th, td {
            padding: 12px 12px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            color: var(--accent-gold);
            font-weight: 600;
            font-size: 0.85rem;
        }
        
        td { font-size: 0.9rem; }

        tr:hover { background-color: #2a374a; }
        
        tr.session-day td:nth-child(2) { color: var(--accent-gold); }
        tr.session-night td:nth-child(2) { color: var(--accent-blue); }

        tr.completed td {
            color: var(--text-muted) !important;
            background-color: rgba(16, 185, 129, 0.05);
        }

        tr.completed td:not(:first-child) {
            text-decoration: line-through;
            opacity: 0.7;
        }

        .badge {
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-right: 3px;
            display: inline-block;
        }

        .badge-big { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
        .badge-small { background-color: rgba(251, 191, 36, 0.2); color: #fde047; border: 1px solid #fbbf24; }
        .badge-micro { background-color: rgba(56, 189, 248, 0.2); color: #7dd3fc; border: 1px solid #38bdf8; }

        .checkbox-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-container input {
            width: 22px;
            height: 22px;
            accent-color: var(--accent-green);
        }
        
        .note {
            color: var(--accent-green);
            font-size: 0.75rem;
            font-weight: bold;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🛡️ 操盤手：複利與停損防禦追蹤器 🛡️</h1>
            <p>每滿 57K 加一倉 | 目標 +180點 | 嚴格停損 -100點</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>已完成盤數</h3>
                <div class="value" id="completedDays">0 / 234</div>
            </div>
            <div class="stat-card">
                <h3>總進度</h3>
                <div class="value" id="progressPercent">0%</div>
            </div>
            <div class="stat-card">
                <h3>年底終極目標</h3>
                <div class="value" id="finalTarget" style="color: var(--accent-green);">計算中...</div>
            </div>
        </div>

        <div class="table-container">
            <table id="trackerTable">
                <thead>
                    <tr>
                        <th style="text-align: center;">達成</th>
                        <th>日期 / 盤別</th>
                        <th>開盤資金</th>
                        <th>部位配置</th>
                        <th style="color: #ef4444;">極限停損 (-100點)</th>
                        <th style="color: #10b981;">目標獲利 (+180點)</th>
                        <th>結算總額</th>
                        <th>備註</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Javascript 自動生成 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const startCapital = 60133;
        const marginPerMicro = 57000; 
        const profitPerMicro = 1800;  // 180點
        const lossPerMicro = 1000;    // 停損 100點 (1微台 100點 = 1000元)
        const salary = 30000;
        const salaryDates = ['2026-07-31', '2026-08-31', '2026-09-30', '2026-10-30', '2026-11-30', '2026-12-31'];

        function generateSessions() {
            let sessions = [];
            let currentDate = new Date('2026-07-22');
            let endDate = new Date('2026-12-31');

            while (currentDate <= endDate) {
                let day = currentDate.getDay();
                if (day !== 0 && day !== 6) { 
                    let isoDate = currentDate.toISOString().split('T')[0];
                    sessions.push({ date: isoDate, type: '日盤', id: isoDate + '-Day' });
                    sessions.push({ date: isoDate, type: '夜盤', id: isoDate + '-Night' });
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return sessions;
        }

        function formatPosition(micros) {
            let big = Math.floor(micros / 20);
            let rem = micros % 20;
            let small = Math.floor(rem / 5);
            let micro = rem % 5;

            let res = [];
            if (big > 0) res.push(`<span class="badge badge-big">${big} 大台</span>`);
            if (small > 0) res.push(`<span class="badge badge-small">${small} 小台</span>`);
            if (micro > 0) res.push(`<span class="badge badge-micro">${micro} 微台</span>`);
            return res.join(" ");
        }

        function formatMoney(num) {
            return Math.floor(num).toLocaleString('en-US') + ' 元';
        }

        function initTracker() {
            const sessions = generateSessions();
            const tableBody = document.getElementById('tableBody');
            let currentCapital = startCapital;
            
            let savedData = JSON.parse(localStorage.getItem('tradingProgress2026_stoploss')) || {};

            sessions.forEach((session, index) => {
                let allowedMicros = Math.floor(currentCapital / marginPerMicro);
                let sessionProfit = allowedMicros * profitPerMicro;
                let sessionLoss = allowedMicros * lossPerMicro; // 100點停損金額
                let openCapital = currentCapital;
                currentCapital += sessionProfit;

                let note = "";
                if (session.type === '夜盤' && salaryDates.includes(session.date)) {
                    currentCapital += salary;
                    note = `<span class="note">+3萬 薪水</span>`;
                }
                
                if(openCapital < 1000000 && currentCapital >= 1000000) note += ` <span class="note" style="color:var(--accent-gold)">🏆 破百萬</span>`;
                if(openCapital < 10000000 && currentCapital >= 10000000) note += ` <span class="note" style="color:var(--accent-gold)">🏆 破千萬</span>`;

                const tr = document.createElement('tr');
                const rowClass = session.type === '日盤' ? 'session-day' : 'session-night';
                tr.classList.add(rowClass);

                const isChecked = savedData[session.id] ? 'checked' : '';
                if(isChecked) tr.classList.add('completed');
                
                let sessionIcon = session.type === '日盤' ? '☀️' : '🌙';

                tr.innerHTML = `
                    <td class="checkbox-container">
                        <input type="checkbox" data-id="${session.id}" onchange="toggleRow(this)" ${isChecked}>
                    </td>
                    <td style="font-family: monospace; font-weight: bold;">
                        ${session.date} ${sessionIcon}${session.type}
                    </td>
                    <td>${formatMoney(openCapital)}</td>
                    <td>${formatPosition(allowedMicros)}</td>
                    <td style="color: #ef4444; font-weight: bold;">- ${formatMoney(sessionLoss)}</td>
                    <td style="color: var(--accent-green); font-weight: bold;">+ ${formatMoney(sessionProfit)}</td>
                    <td style="color: var(--accent-gold); font-weight: bold;">${formatMoney(currentCapital)}</td>
                    <td>${note}</td>
                `;
                tableBody.appendChild(tr);
            });

            document.getElementById('finalTarget').innerText = formatMoney(currentCapital);
            updateStats();
        }

        function toggleRow(checkbox) {
            const tr = checkbox.closest('tr');
            const id = checkbox.getAttribute('data-id');
            
            let savedData = JSON.parse(localStorage.getItem('tradingProgress2026_stoploss')) || {};

            if (checkbox.checked) {
                tr.classList.add('completed');
                savedData[id] = true;
            } else {
                tr.classList.remove('completed');
                delete savedData[id];
            }
            
            localStorage.setItem('tradingProgress2026_stoploss', JSON.stringify(savedData));
            updateStats();
        }

        function updateStats() {
            let savedData = JSON.parse(localStorage.getItem('tradingProgress2026_stoploss')) || {};
            let completedCount = Object.keys(savedData).length;
            let totalSessions = document.querySelectorAll('input[type="checkbox"]').length;
            
            let percent = totalSessions > 0 ? Math.round((completedCount / totalSessions) * 100) : 0;

            document.getElementById('completedDays').innerText = `${completedCount} / ${totalSessions}`;
            document.getElementById('progressPercent').innerText = `${percent}%`;
        }

        window.onload = initTracker;
    </script>
</body>
</html>
